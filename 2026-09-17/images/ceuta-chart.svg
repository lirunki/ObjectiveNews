<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280">
  <rect width="640" height="280" fill="#fffdf8" stroke="#d9d0c0"/>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#1c1914">Ceuta port shelter — court status</text>
  <text x="80" y="90" font-size="13" fill="#1c1914">Area allocated: ~16 000 m² (Poniente pier)</text>
  <text x="80" y="120" font-size="13" fill="#1c1914">Planned capacity: ~1 000 persons</text>
  <text x="80" y="150" font-size="13" fill="#1c1914">Order: provisional suspension (Audiencia Nacional)</text>
  <text x="80" y="180" font-size="13" fill="#1c1914">Date of order: 16–17 September 2026</text>
  <text x="320" y="250" text-anchor="middle" font-size="11" fill="#5c564c">Source: court order reported by Europa Press / wires</text>
</svg>
