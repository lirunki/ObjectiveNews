<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440"><rect width="800" height="440" fill="#f7f4ee"/><text x="24" y="36" font-family="Georgia,serif" font-size="20">Cifras de asistencia y de votación (fuentes citadas)</text><text x="24" y="64" font-family="sans-serif" font-size="13" fill="#444">RTVE y Europa Press, 3 oct 2026; El País, 2 oct 2026. Conteos de calle no son un censo.</text><rect x="40" y="100" width="70" height="28" fill="#3d5a80"/><text x="120" y="120" font-size="14" font-family="sans-serif">70.000 — Delegación del Gobierno en Madrid</text><rect x="40" y="150" width="500" height="28" fill="#8a5a44"/><text x="550" y="170" font-size="14" font-family="sans-serif">500.000 — Sindicato de Inquilinas</text><rect x="40" y="210" width="172" height="28" fill="#2f6f4e"/><text x="220" y="230" font-size="14" font-family="sans-serif">Decreto 1: 172 sí / 178 no</text><rect x="40" y="255" width="166" height="28" fill="#2f6f4e"/><text x="220" y="275" font-size="14" font-family="sans-serif">Decreto 2: 166 sí / 184 no</text><text x="40" y="340" font-family="sans-serif" font-size="14">26 sep: Delegación 25.000 vs convocantes 300.000 (Europa Press, sobre la marcha previa)</text><text x="40" y="380" font-family="sans-serif" font-size="14">El adelanto al 29 de noviembre es hipótesis de prensa, no un real decreto de disolución.</text></svg>