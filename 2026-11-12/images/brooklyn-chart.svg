<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#fffdf8"/>
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="16">Reported casualties as of Thursday morning</text>
  <text x="100" y="100" font-family="sans-serif">Dead: 8</text>
  <text x="100" y="140" font-family="sans-serif">Injured: 17–25</text>
  <text x="100" y="180" font-family="sans-serif">Critical: 4</text>
  <text x="100" y="220" font-family="sans-serif">Children among casualties: ≥7</text>
</svg>
