  <text x="360" y="374" font-family="system-ui, sans-serif" font-size="13" fill="#555">desalojados</text>
  <rect x="620" y="284" width="90" height="46" fill="#3d5a80"/>
  <text x="610" y="355" font-family="system-ui, sans-serif" font-size="14" fill="#222">400</text>
  <text x="575" y="374" font-family="system-ui, sans-serif" font-size="13" fill="#555">retorno, SER</text>
</svg>
