  <text x="32" y="68" font-family="system-ui, sans-serif" font-size="14" fill="#555">Cifras de prensa: más de 3.500 en el asentamiento (RTVE); 700 desalojados (Cadena SER). No es un censo oficial publicado.</text>
  <rect x="140" y="110" width="90" height="220" fill="#8a8175"/>
