<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Litros por metro cuadrado citados para Barcelona">
  <rect width="880" height="400" fill="#f7f4ee"/>
  <text x="32" y="40" font-family="Georgia, serif" font-size="22" fill="#222">Lluvia citada en Barcelona, 3 de octubre</text>
  <text x="32" y="68" font-family="system-ui, sans-serif" font-size="14" fill="#555">Newtral, a partir de Meteocat: 190,8 l/m² en El Raval hasta medianoche; 213 en Can Bruixa en 24 horas.</text>
  <rect x="180" y="130" width="140" height="190" fill="#3d5a80"/>
  <text x="190" y="350" font-family="system-ui, sans-serif" font-size="15" fill="#222">190,8 El Raval</text>
  <rect x="480" y="108" width="140" height="212" fill="#2f5d50"/>
  <text x="490" y="350" font-family="system-ui, sans-serif" font-size="15" fill="#222">213 Can Bruixa</text>
</svg>
