<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <rect width="880" height="400" fill="#f7f5f0"/>
  <text x="36" y="44" font-family="Georgia, serif" font-size="20" fill="#1c2830">Calendario del RD 806/2026 (EFE / Infobae)</text>
  <text x="36" y="110" font-family="sans-serif" font-size="18" fill="#1c2830">6 oct — publicación y entrada en vigor</text>
  <text x="36" y="160" font-family="sans-serif" font-size="18" fill="#1c2830">13–27 nov — campaña de 15 días</text>
  <text x="36" y="210" font-family="sans-serif" font-size="18" fill="#1c2830">29 nov — votación (350 diputados)</text>
  <text x="36" y="260" font-family="sans-serif" font-size="18" fill="#1c2830">23 dic — sesiones constitutivas, 10:00</text>
  <text x="36" y="340" font-family="sans-serif" font-size="14" fill="#3d4c58">Madrid 38 escaños; Barcelona 32; Valencia 16. No es el censo oficial de la Junta Electoral Central.</text>
</svg>
