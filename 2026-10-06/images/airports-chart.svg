<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
  <rect width="880" height="380" fill="#f7f5f0"/>
  <text x="36" y="42" font-family="Georgia, serif" font-size="20" fill="#1c2830">Injuries at two airports — Saudi civil aviation, 6 Oct</text>
  <rect x="220" y="100" width="90" height="40" fill="#8a7048"/>
  <text x="36" y="126" font-family="sans-serif" font-size="16" fill="#1c2830">GACA minor injuries</text>
  <text x="330" y="126" font-family="sans-serif" font-size="16" fill="#1c2830">3</text>
  <text x="36" y="210" font-family="sans-serif" font-size="16" fill="#1c2830">Sites named: Jazan (King Abdullah) and Najran.</text>
  <text x="36" y="250" font-family="sans-serif" font-size="16" fill="#1c2830">Houthi claim set is wider (Riyadh, Rabigh, Abha, Khamis Mushait).</text>
  <text x="36" y="310" font-family="sans-serif" font-size="14" fill="#3d4c58">Al Jazeera and The National both quote the authority’s “minor” figure. No independent hospital count in these pieces.</text>
