<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <rect width="880" height="400" fill="#f7f5f0"/>
  <text x="36" y="42" font-family="Georgia, serif" font-size="20" fill="#1c2830">2009 Fort Hood toll cited by the Pentagon spokesman</text>
  <rect x="200" y="90" width="160" height="44" fill="#6a5a52"/>
  <text x="36" y="118" font-family="sans-serif" font-size="16" fill="#1c2830">Killed</text>
  <text x="380" y="118" font-family="sans-serif" font-size="16" fill="#1c2830">13</text>
  <rect x="200" y="170" width="400" height="44" fill="#8a7a70"/>
  <text x="36" y="198" font-family="sans-serif" font-size="16" fill="#1c2830">Wounded</text>
  <text x="620" y="198" font-family="sans-serif" font-size="16" fill="#1c2830">32</text>
  <text x="36" y="280" font-family="sans-serif" font-size="15" fill="#1c2830">Conviction: 2013 court-martial. Approval: 5 Oct 2026 statement.</text>
  <text x="36" y="320" font-family="sans-serif" font-size="14" fill="#3d4c58">Counts are from the Pentagon post as reported by Reuters. No execution date has been set in these sources.</text>
</svg>
