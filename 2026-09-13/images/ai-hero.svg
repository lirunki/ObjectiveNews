<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Schematic of three proposed AI pacing steps">
  <rect width="900" height="360" fill="#fffdf8"/>
  <text x="24" y="36" font-size="18" font-family="Georgia,serif">Amodei letter: three steps, decreasing likelihood</text>
  <rect x="30" y="70" width="260" height="220" fill="#e4eee8" stroke="#2b4c3f"/>
  <text x="44" y="110" font-size="16">1. Embedded evaluators</text>
  <text x="44" y="150" font-size="13">Lab-level. Anthropic says</text>
  <text x="44" y="170" font-size="13">it will start at home.</text>
  <rect x="320" y="70" width="260" height="220" fill="#efe8dc" stroke="#1c1914"/>
  <text x="334" y="110" font-size="16">2. Allied standards</text>
  <text x="334" y="150" font-size="13">Democratic-country labs</text>
  <text x="334" y="170" font-size="13">plus governments.</text>
  <rect x="610" y="70" width="260" height="220" fill="#f4ece6" stroke="#8b3a2a"/>
  <text x="624" y="110" font-size="16">3. Global coordination</text>
  <text x="624" y="150" font-size="13">Includes China. Author</text>
  <text x="624" y="170" font-size="13">calls this hardest.</text>
  <text x="24" y="330" font-size="12" fill="#5c564c">Original schematic. Essay title reported as We Must Pace the Frontier.</text>
</svg>
