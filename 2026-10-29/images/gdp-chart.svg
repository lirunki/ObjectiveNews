<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#fffdf8"/>
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1c1914">Real GDP growth, SAAR (BEA advance)</text>
