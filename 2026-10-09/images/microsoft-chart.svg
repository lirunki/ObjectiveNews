<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><rect width="800" height="400" fill="#f7f4ee"/><text x="24" y="36" font-family="Georgia,serif" font-size="18" fill="#222">Vance figures vs Microsoft July job-cut figure</text><text x="24" y="58" font-size="13" fill="#555">Vance: 6,000 laid off; 6,300 H-1B; ~3,000 green cards. Microsoft July: 4,800 jobs, 2.1%.</text><rect x="90" y="140" width="70" height="180" fill="#3d5a6c"/><rect x="220" y="110" width="70" height="210" fill="#6a8494"/><rect x="350" y="180" width="70" height="140" fill="#8aa0ae"/><rect x="500" y="170" width="70" height="150" fill="#4d6d7e"/><text x="90" y="350" font-size="12">6,000</text><text x="220" y="350" font-size="12">6,300</text><text x="350" y="350" font-size="12">3,000</text><text x="500" y="350" font-size="12">4,800</text></svg>