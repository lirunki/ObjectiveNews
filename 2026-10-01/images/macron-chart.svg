<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f4f1ea"/>
  <text x="36" y="48" font-family="Georgia, serif" font-size="22" fill="#222">Tres capas, no una adhesión</text>
  <text x="36" y="130" font-family="sans-serif" font-size="18" fill="#222">Burnham: opciones, incluida la reentrada</text>
  <text x="36" y="190" font-family="sans-serif" font-size="18" fill="#222">Sánchez y Macron: bienvenida verbal</text>
  <text x="36" y="250" font-family="sans-serif" font-size="18" fill="#222">Artículo 49: solicitud, Comisión, unanimidad</text>
  <text x="36" y="330" font-family="sans-serif" font-size="14" fill="#555">Fuente: Reuters y Politico, 30 de septiembre de 2026.</text>
</svg>
