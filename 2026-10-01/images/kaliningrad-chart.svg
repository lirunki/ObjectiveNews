<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#f4f1ea"/>
  <text x="36" y="48" font-family="Georgia, serif" font-size="22" fill="#222">Two documents Reuters reported seeing</text>
  <text x="36" y="140" font-family="sans-serif" font-size="18" fill="#222">Russian note: nuclear use if Kaliningrad is isolated</text>
  <text x="36" y="190" font-family="sans-serif" font-size="18" fill="#222">NATO reply: exercises are not a threat; stop the rhetoric</text>
  <text x="36" y="240" font-family="sans-serif" font-size="18" fill="#222">Rutte: defensive alliance; threats not called for</text>
  <text x="36" y="320" font-family="sans-serif" font-size="14" fill="#555">Not an order of battle. Source: Reuters, 30 September 2026.</text>
</svg>
