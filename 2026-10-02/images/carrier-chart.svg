  <text x="420" y="350" font-family="sans-serif" font-size="14" fill="#222">Marines</text>
  <text x="40" y="400" font-family="Georgia,serif" font-size="13" fill="#555">AP total for the group: roughly 9,000. Regional naval presence if joined: more than 20,000.</text>
