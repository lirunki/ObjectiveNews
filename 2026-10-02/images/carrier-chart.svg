  <text x="40" y="64" font-family="Georgia,serif" font-size="13" fill="#555">AP, citing one U.S. official, 1 October 2026. Not a Navy public manifest.</text>
  <rect x="140" y="140" width="140" height="180" fill="#4a5a6a"/>
  <text x="165" y="230" font-family="sans-serif" font-size="22" fill="#fff">7,000+</text>
